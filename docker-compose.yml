services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Every var in .env, whatever it grows to hold; see .env.example.
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "1"
    # Mount the source so --reload picks up edits without a rebuild.
    volumes:
      - ./app:/code/app
      - ./main.py:/code/main.py
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
